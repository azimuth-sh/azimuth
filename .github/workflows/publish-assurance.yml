name: publish assurance images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - id: api
            name: ghcr.io/azimuth-sh/azimuth-assurance-api
            context: .
            dockerfile: services/assurance/server/Dockerfile
          - id: web
            name: ghcr.io/azimuth-sh/azimuth-assurance-web
            context: services/assurance/web
            dockerfile: services/assurance/web/Dockerfile
        platform:
          - name: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - name: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    environment: assurance-images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          build-args: AZIMUTH_VERSION=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            sh.azimuth.verification=build-and-inspection-only
          outputs: type=image,name=${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=candidate-assurance-${{ matrix.image.id }}-${{ matrix.platform.architecture }}
          cache-to: type=gha,mode=max,scope=candidate-assurance-${{ matrix.image.id }}-${{ matrix.platform.architecture }}
          provenance: mode=max
      - name: Retain platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCHITECTURE: ${{ matrix.platform.architecture }}
        run: |
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$IMAGE_ARCHITECTURE"
      - uses: actions/upload-artifact@v7
        with:
          name: assurance-digest-${{ matrix.image.id }}-${{ matrix.platform.architecture }}-${{ github.run_attempt }}
          path: digests/${{ matrix.platform.architecture }}
          if-no-files-found: error

  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - id: api
            name: ghcr.io/azimuth-sh/azimuth-assurance-api
          - id: web
            name: ghcr.io/azimuth-sh/azimuth-assurance-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: assurance-images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: assurance-digest-${{ matrix.image.id }}-*-${{ github.run_attempt }}
          path: digests
          merge-multiple: true
      - id: publish
        name: Publish and inspect the multi-platform image
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_ID: ${{ matrix.image.id }}
        run: |
          set -euo pipefail
          image_tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          amd64_digest=$(cat digests/amd64)
          arm64_digest=$(cat digests/arm64)
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$IMAGE_NAME:$image_tag" \
            "$IMAGE_NAME@$amd64_digest" "$IMAGE_NAME@$arm64_digest"
          docker buildx imagetools inspect "$IMAGE_NAME:$image_tag" \
            --format '{{json .Manifest}}' > manifest.json
          image_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' manifest.json)
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' manifest.json
          jq -n --arg image "$IMAGE_NAME" --arg tag "$image_tag" \
            --arg digest "$image_digest" --arg revision "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{image: $image, tag: $tag, digest: $digest, sourceRevision: $revision, workflowRun: $workflowRun, verification: "build-and-inspection-only"}' \
            > publication.json
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'assurance_%s_image = "%s@%s"\n' "$IMAGE_ID" "$IMAGE_NAME" "$image_digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v7
        with:
          name: assurance-publication-${{ matrix.image.id }}-${{ github.run_attempt }}
          path: |
            publication.json
            manifest.json
          if-no-files-found: error
