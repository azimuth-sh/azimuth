name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    outputs:
      image-matrix: ${{ steps.matrix.outputs.images }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@azimuth-sh"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - id: matrix
        shell: bash
        run: |
          echo "images=$(python3 release/orchestrate.py matrix image)" >> "$GITHUB_OUTPUT"
      - name: Read public state and validate the release boundary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py preflight \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums-out dist/publication/SHA256SUMS \
            --state-out dist/publication/public-state.json \
            --plan-out dist/publication/publication-plan.json \
            --receipt-out dist/publication/preflight.json \
            --require-credentials
      - name: Publish planner-selected targets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py publish \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums dist/publication/SHA256SUMS \
            --state dist/publication/public-state.json \
            --plan dist/publication/publication-plan.json \
            --out dist/publication/publication-result.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: publication-records
          path: dist/publication/*
          if-no-files-found: error

  image-provenance:
    needs: publish
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish.outputs.image-matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: publication-records
          path: dist/publication
      - id: image
        shell: bash
        env:
          IMAGE_ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py image-state \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums dist/publication/SHA256SUMS \
            --id "$IMAGE_ID" > dist/image-state.json
          echo "name=$(jq -r .name dist/image-state.json)" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r .digest dist/image-state.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  complete:
    needs: [publish, image-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: publication-records
          path: dist/publication
      - name: Retrieve every public target
        shell: bash
        env:
          PUBLICATION_RUN: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          for attempt in {1..20}; do
            if python3 release/publication.py complete \
              --candidates dist/candidates \
              --tag "$RELEASE_TAG" \
              --revision "$RELEASE_REVISION" \
              --sums dist/publication/SHA256SUMS \
              --publication-run "$PUBLICATION_RUN" \
              --out dist/publication/completion.json; then
              exit 0
            fi
            if [[ "$attempt" == 20 ]]; then
              exit 1
            fi
            sleep 15
          done
      - uses: actions/upload-artifact@v7
        with:
          name: public-release-completion
          path: dist/publication/completion.json
          if-no-files-found: error
