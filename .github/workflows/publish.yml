name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    outputs:
      image-matrix: ${{ steps.matrix.outputs.images }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install an npm that supports trusted publishing and dist-tag
        run: npm install --global npm@11.21.2
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - id: matrix
        shell: bash
        run: |
          echo "images=$(python3 release/orchestrate.py matrix image)" >> "$GITHUB_OUTPUT"
      - name: Exchange NuGet trusted-publishing token
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Exchange crates.io trusted-publishing token
        id: crates
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Require every registry exchange before any publication
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "NuGet exchange returned no API key" >&2; exit 1; }
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "crates.io exchange returned no token" >&2; exit 1; }
      - name: Read public state and validate the release boundary
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py preflight \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums-out dist/publication/SHA256SUMS \
            --state-out dist/publication/public-state.json \
            --plan-out dist/publication/publication-plan.json \
            --receipt-out dist/publication/preflight.json \
            --require-credentials
      - name: Publish planner-selected targets
        shell: bash
        env:
          NPM_FIRST_PUBLISH_TESTING_PLAYWRIGHT: ${{ secrets.NPM_FIRST_PUBLISH_TESTING_PLAYWRIGHT }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py publish \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums dist/publication/SHA256SUMS \
            --state dist/publication/public-state.json \
            --plan dist/publication/publication-plan.json \
            --out dist/publication/publication-result.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: publication-records
          path: dist/publication/*
          if-no-files-found: error

  image-provenance:
    needs: publish
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish.outputs.image-matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: publication-records
          path: dist/publication
      - id: image
        shell: bash
        env:
          IMAGE_ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python3 release/publication.py image-state \
            --candidates dist/candidates \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --sums dist/publication/SHA256SUMS \
            --id "$IMAGE_ID" > dist/image-state.json
          echo "name=$(jq -r .name dist/image-state.json)" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r .digest dist/image-state.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  complete:
    needs: [publish, image-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: publication-records
          path: dist/publication
      - name: Retrieve every public target
        shell: bash
        env:
          PUBLICATION_RUN: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          for attempt in {1..20}; do
            if python3 release/publication.py complete \
              --candidates dist/candidates \
              --tag "$RELEASE_TAG" \
              --revision "$RELEASE_REVISION" \
              --sums dist/publication/SHA256SUMS \
              --publication-run "$PUBLICATION_RUN" \
              --out dist/publication/completion.json; then
              exit 0
            fi
            if [[ "$attempt" == 20 ]]; then
              exit 1
            fi
            sleep 15
          done
      - uses: actions/upload-artifact@v7
        with:
          name: public-release-completion
          path: dist/publication/completion.json
          if-no-files-found: error
