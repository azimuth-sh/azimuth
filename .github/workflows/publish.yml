name: release

# A person publishes by pushing a version tag; nothing else starts a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag equals the version in the code
        run: sh release/check-tag.sh "$GITHUB_REF_NAME"

  tests:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p azimuth
      # The binary is proven here, on the machine that built it, before anything is handed on.
      - name: Prove the binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="target/$TARGET/release/azimuth"
          printed="$("$binary" --version)"
          if [ "$printed" != "$version" ]; then
            echo "the binary prints the version '$printed', not $version" >&2
            exit 1
          fi
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            file "$binary"
            if file "$binary" | grep -q "dynamically linked"; then
              echo "file says the Linux binary is linked dynamically" >&2
              exit 1
            fi
            linked="$(ldd "$binary" 2>&1 || true)"
            case "$linked" in
              *"not a dynamic executable"* | *"statically linked"*) ;;
              *)
                echo "ldd says the Linux binary is linked dynamically: $linked" >&2
                exit 1
                ;;
            esac
          fi
          mkdir dist
          cp "$binary" "dist/azimuth-$version-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  package:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack the .NET adapter
        run: dotnet pack adapters/xunit --configuration Release -p:Version="${GITHUB_REF_NAME#v}" --output package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.nupkg
          if-no-files-found: error

  npm:
    needs: [check, tests, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack the Playwright adapter and stage that file
        run: |
          cd adapters/playwright
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm pack --pack-destination ../..
          cd ../..
          npm stage publish azimuth-sh-playwright-*.tgz --access public

  draft:
    needs: [check, tests, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Assemble the release files
        run: sh release/assemble.sh "${GITHUB_REF_NAME#v}" dist
      - name: Make the draft with every release file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "azimuth $version" --notes "" \
            "dist/azimuth-$version-aarch64-apple-darwin" \
            "dist/azimuth-$version-x86_64-unknown-linux-musl" \
            dist/SHA256SUMS dist/VERSION

  nuget:
    needs: [draft, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # --skip-duplicate makes a second run of this job harmless.
      - name: Push the package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push package/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: nuget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      # The installer reads the latest normal release, also while the version says alpha.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest

  site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
