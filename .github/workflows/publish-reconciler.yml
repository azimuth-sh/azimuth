name: publish reconciler image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-reconciler-image-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/reconciler/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/azimuth-sh/azimuth-reconciler:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
      - name: Record publication
        env:
          IMAGE: ghcr.io/azimuth-sh/azimuth-reconciler
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('publication.json').write_text(json.dumps({'image': os.environ['IMAGE'], 'digest': os.environ['DIGEST'], 'source_revision': os.environ['GITHUB_SHA']}))
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: publication
          path: publication.json
