name: site

# The site is published only by a person's act: a version tag, through the release workflow, or
# a manual start from main. A push publishes nothing.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # A manual start can name any branch, so the job fails there instead of being skipped, and
      # the person sees why nothing was published.
      - name: Only main or a version tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "the site is published only from main or a version tag, not from $GITHUB_REF" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
