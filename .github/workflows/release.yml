name: release rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release/**"
      - "scripts/check.sh"
      - "tools/azimuth/**"
      - "packages/dotnet/**"
      - "packages/typescript/**"
      - "tools/extractors/dotnet/**"
      - "tools/extractors/typescript/**"
      - "services/assurance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      image: ${{ steps.matrix.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        shell: bash
        run: |
          echo "native=$(python3 release/orchestrate.py matrix native)" >> "$GITHUB_OUTPUT"
          echo "image=$(python3 release/orchestrate.py matrix image)" >> "$GITHUB_OUTPUT"

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 release/candidates.py packages --out dist/packages
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/packages/*
      - uses: actions/upload-artifact@v7
        with:
          name: candidates-packages
          path: dist/packages/*
          if-no-files-found: error

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: >-
          python release/candidates.py native
          --out dist/native
          --target "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/native/${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidates-native-${{ matrix.target }}
          path: dist/native/${{ matrix.archive }}
          if-no-files-found: error

  images:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.image) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: |
          mkdir -p dist/images
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ matrix.identity }}:${{ matrix.version }}
          outputs: type=oci,dest=${{ github.workspace }}/dist/images/${{ matrix.archive }}
          cache-from: type=gha,scope=release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.id }}
          provenance: mode=max
      - run: >-
          python3 release/candidates.py smoke-image
          --id "$IMAGE_ID"
          --archive "dist/images/$IMAGE_ARCHIVE"
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_ARCHIVE: ${{ matrix.archive }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/images/${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidates-image-${{ matrix.id }}
          path: dist/images/${{ matrix.archive }}
          if-no-files-found: error

  account:
    needs: [packages, native, images]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: candidates-*
          path: dist/candidates
          merge-multiple: true
      - name: Require every lane
        if: >-
          ${{ !success() || needs.packages.result != 'success' ||
              needs.native.result != 'success' || needs.images.result != 'success' }}
        run: exit 1
      - name: Assemble tagged candidate account
        shell: bash
        run: |
          tag=$(python3 -c \
            "import json; print(json.load(open('release/artifacts.json'))['release']['tag'])")
          git rev-parse "$tag" >/dev/null 2>&1 || \
            git -c user.name=Azimuth -c user.email=azimuth@example.test \
              tag --annotate "$tag" --message rehearsal "$GITHUB_SHA"
          python3 release/orchestrate.py assemble \
            --candidates dist/candidates \
            --revision "$GITHUB_SHA" \
            --tag "$tag" \
            --verify-tag \
            --out dist/account/candidates.json
          python3 release/orchestrate.py verify \
            --candidates dist/candidates \
            --account dist/account/candidates.json
          python3 release/orchestrate.py rehearse \
            --account dist/account/candidates.json \
            --out dist/account/publication-rehearsal.json
      - run: python3 -m unittest -v release.test_orchestrate
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-account
          path: dist/account/*
          if-no-files-found: error
