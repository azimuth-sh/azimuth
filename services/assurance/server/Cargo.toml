[package]
name = "azimuth-assurance-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
azimuth-assurance-domain = { path = "../domain" }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }
tokio.workspace = true
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
testcontainers-modules = { version = "0.12.1", features = ["postgres"] }
