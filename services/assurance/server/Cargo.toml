[package]
name = "azimuth-assurance-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
azimuth = { path = "../../../tools/azimuth" }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
testcontainers-modules = { version = "0.12.1", features = ["postgres"] }

[[bin]]
name = "run-ledger"
path = "src/run_ledger_main.rs"
