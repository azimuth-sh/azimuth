[package]
name = "azimuth"
version = "0.2.0-alpha.5"
edition = "2021"
license = "Apache-2.0"
description = "Azimuth core CLI"
# The CLI reaches users only as binaries on the release.
publish = false

[[bin]]
name = "azimuth"
path = "src/main.rs"

# The core runs in other people's CI, so it carries this fixed list of crates and nothing else.
# Adding one is a change of the design.
[dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
unicode-normalization = "0.1"
