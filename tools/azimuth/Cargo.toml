[package]
name = "azimuth"
version = "0.1.0-alpha.5"
edition = "2021"
description = "Derives and validates an evidence-control-plane model."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/azimuth-sh/azimuth"
homepage = "https://azimuth.sh"
keywords = ["requirements", "traceability", "verification", "sdd"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
include = ["src/**", "resources/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

# No dependencies. The destination is other people's CI.

[[bin]]
name = "azimuth"
path = "src/main.rs"

[lib]
name = "azimuth"
path = "src/lib.rs"
