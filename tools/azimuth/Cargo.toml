[package]
name = "azimuth"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Derives a model from claims, linkage tags and evidence, and flags its holes."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/drim-dev/azimuth"
homepage = "https://github.com/drim-dev/azimuth/tree/main/tools/azimuth"
keywords = ["requirements", "traceability", "verification", "sdd"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

# No dependencies, by decision (D17). The destination is other people's CI.

[[bin]]
name = "azimuth"
path = "src/main.rs"

[lib]
name = "azimuth"
path = "src/lib.rs"
