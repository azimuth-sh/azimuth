[package]
name = "azimuth-emit-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[[bin]]
name = "azimuth-emit-rust"
path = "src/main.rs"
